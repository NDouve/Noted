# Continuous integration: static checks and tests on every push and pull
# request, plus release builds of the Windows and macOS apps.
#
# Not run here: app/integration_test. It drives the real app and needs an
# interactive desktop session, so it stays a local check.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref replaces the one still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  checks:
    name: Analyze and test (${{ matrix.os }})
    # Both Windows and Linux block a push, so Linux-only failures, such as
    # per-process file locks, stop it too.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies (workspace root)
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test the annotation script
        shell: bash
        run: dart .github/scripts/test/test_annotations_test.dart

      # The PowerShell scripts that package the app and register the MCP
      # server. Windows PowerShell 5.1 with the Pester 3 it ships.
      - name: Test the Windows scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Import-Module Pester -MaximumVersion 3.99 -Force
          $r = Invoke-Pester app/scripts/test/register-mcp.tests.ps1 -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      # Every package that has a test/ directory: app, packages/* and
      # packages/boxes/*. All of them depend on Flutter's test framework, so
      # flutter test runs them all. A failing package does not stop the rest.
      # Each package's dart_test.yaml fails a test after 2 minutes, but a test
      # stuck in a synchronous loop never lets that timer run. So a package
      # gets 15 minutes in all; then its test process is killed and the last
      # tests it started are reported. Failed tests are reported by name, with
      # their own error message (.github/scripts/test_annotations.dart).
      # (Annotations can be read without signing in; the log can't.)
      - name: Test
        shell: bash
        run: |
          failed=""
          # GitHub shows only 10 error annotations per step. So the summary and
          # the timeouts are printed first, then the failed tests (4 in all).
          first="$RUNNER_TEMP/annotations-first.txt"
          per_test="$RUNNER_TEMP/annotations-tests.txt"
          : > "$first"; : > "$per_test"
          for dir in app packages/* packages/boxes/*; do
            if [ -d "$dir/test" ]; then
              echo "::group::flutter test $dir"
              log="$RUNNER_TEMP/test-$(echo "$dir" | tr '/' '-').log"
              # Into a file, not a pipe: a test process left behind by the
              # timeout would keep a pipe open.
              # (The step's shell stops at the first failing command, hence
              # the || here.)
              json="$RUNNER_TEMP/test-$(echo "$dir" | tr '/' '-').json"
              # The Windows flutter needs a Windows path for the file reporter.
              jsonarg="$json"
              if command -v cygpath > /dev/null; then jsonarg=$(cygpath -m "$json"); fi
              code=0
              (cd "$dir" && timeout 900 flutter test --reporter expanded --file-reporter "json:$jsonarg" > "$log" 2>&1) || code=$?
              cat "$log"
              if [ "$code" -ne 0 ]; then
                failed="$failed $dir"
                if [ "$code" -eq 124 ]; then
                  taskkill //F //IM flutter_tester.exe > /dev/null 2>&1 || pkill -f flutter_tester > /dev/null 2>&1 || true
                  last=$(grep -E '^[0-9]+:[0-9]+ \+' "$log" | tail -n 3 | tr '\n' ' ' || true)
                  echo "::error title=Timed out in $dir::Still running after 15 minutes. Last tests: $last" >> "$first"
                fi
                # Each failed test as one annotation: its name, its own error,
                # stack trace and printed output (from the JSON event stream,
                # keyed by test), and its file and line.
                dart "$GITHUB_WORKSPACE/.github/scripts/test_annotations.dart" "$json" "$dir" >> "$per_test" || true
              fi
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Tests failed in:$failed"
            head -n 5 "$first"
            head -n 4 "$per_test"
            exit 1
          fi

  windows-release:
    name: Windows release build
    # Runs in parallel with checks so a build problem shows up without
    # waiting for the tests. The zip is a build, not a published release.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (workspace root)
        run: flutter pub get

      # Builds app/ in release mode, adds the Visual C++ runtime DLLs from
      # System32 (present on the runner image) and writes the zip.
      - name: Build and package
        shell: pwsh
        run: ./app/scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Noted-windows-x64
          path: app/build/Noted-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos-build:
    name: macOS release build
    # Apple Silicon. When GitHub has no machine free it gives up after about
    # 15 minutes and marks the job cancelled; the Intel job below covers it.
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (workspace root)
        run: flutter pub get

      # Unsigned: no team or certificate is configured, so the app is for
      # inspection and Gatekeeper will not open it without an override.
      - name: Build
        working-directory: app
        run: flutter build macos --release

      - name: Zip Noted.app
        working-directory: app/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent Noted.app "$GITHUB_WORKSPACE/Noted-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Noted-macos
          path: Noted-macos.zip
          if-no-files-found: error
          retention-days: 14

      # iPad/iPhone test build, after the macOS upload so a failure here
      # never costs the macOS artifact. Unsigned: no team or certificate is
      # configured, so it must be re-signed before it can be installed.
      # Mobile builds only on pushes to main and manual runs, not PRs.
      - name: Build iOS (unsigned)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: app
        run: flutter build ipa --release --no-codesign

      # flutter build ipa --no-codesign leaves an .xcarchive; the app is the
      # one .app inside it.
      - name: Package unsigned .ipa
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: app
        run: |
          set -e
          apps=(build/ios/archive/Runner.xcarchive/Products/Applications/*.app)
          if [ "${#apps[@]}" -ne 1 ] || [ ! -d "${apps[0]}" ]; then
            echo "::error::Expected exactly one .app in the Runner.xcarchive, found: ${apps[*]}"
            exit 1
          fi
          rm -rf Payload Noted-unsigned.ipa
          mkdir Payload
          ditto "${apps[0]}" "Payload/$(basename "${apps[0]}")"
          zip -qry Noted-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: Noted-unsigned-ipa
          path: app/Noted-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  macos-build-intel:
    name: macOS release build (Intel fallback)
    # Runs alongside the Apple Silicon job rather than after it: GitHub
    # reports "no machine free" as a cancellation, which a dependent job
    # can't tell apart from a run cancelled by a newer push. The Intel pool
    # is separate; GitHub supports it until the macOS 15 image retires in
    # fall 2027. Either job's zip is the same app.
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (workspace root)
        run: flutter pub get

      # Unsigned: no team or certificate is configured, so the app is for
      # inspection and Gatekeeper will not open it without an override.
      - name: Build
        working-directory: app
        run: flutter build macos --release

      - name: Zip Noted.app
        working-directory: app/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent Noted.app "$GITHUB_WORKSPACE/Noted-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Noted-macos-intel-runner
          path: Noted-macos.zip
          if-no-files-found: error
          retention-days: 14

      # Same unsigned .ipa as the Apple Silicon job. continue-on-error: the
      # Apple Silicon job is the one that must pass; an iOS failure that only
      # shows on this older, scarcer Intel machine must not fail the run.
      # Mobile builds only on pushes to main and manual runs, not PRs. The
      # step timeout plus continue-on-error keeps a slow Intel build green.
      - name: Build iOS (unsigned)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        timeout-minutes: 30
        continue-on-error: true
        working-directory: app
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned .ipa
        id: ipa
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        working-directory: app
        run: |
          set -e
          apps=(build/ios/archive/Runner.xcarchive/Products/Applications/*.app)
          if [ "${#apps[@]}" -ne 1 ] || [ ! -d "${apps[0]}" ]; then
            echo "::error::Expected exactly one .app in the Runner.xcarchive, found: ${apps[*]}"
            exit 1
          fi
          rm -rf Payload Noted-unsigned.ipa
          mkdir Payload
          ditto "${apps[0]}" "Payload/$(basename "${apps[0]}")"
          zip -qry Noted-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: steps.ipa.outcome == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        with:
          name: Noted-unsigned-ipa-intel-runner
          path: app/Noted-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: Android release build
    # Debug-signed: no release key is configured, so Flutter's template signs
    # the release build with the debug key. Fine for installing a test build.
    # Pushes to main and manual runs only, not PRs.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (workspace root)
        run: flutter pub get

      - name: Build
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Noted-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
