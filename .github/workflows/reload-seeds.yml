# Manual run of the iCloud reload-equivalence test on the Windows runner: a
# range of seeds, then one seed repeated. Each step stops at its first failing
# seed and prints the failure (the lost marker, the last write to its file and
# the Dart stack of the app's write). With `load`, each step runs beside two
# other heavy test files in one -j 6 invocation. Uploads nothing.
name: Reload seeds

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seeds to run: numbers and ranges, e.g. 1-40 or 3,7,20-25 (empty: skip)'
        default: '1-40'
      repeat_seed:
        description: 'The seed to repeat'
        type: number
        default: 23
      repeat_count:
        description: 'How many times to repeat it (0: skip)'
        type: number
        default: 200
      load:
        description: 'Under load: each step also runs test/notebook_test.dart and test/reload_equivalence_test.dart, in the same -j 6 invocation'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  reload-seeds:
    name: Reload seeds (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies (workspace root)
        run: flutter pub get

      - name: Seeds
        if: ${{ inputs.seeds != '' }}
        shell: bash
        working-directory: app
        timeout-minutes: 40
        env:
          NOTED_RELOAD_SEEDS: ${{ inputs.seeds }}
          NOTED_RELOAD_ONLY_SEEDS: ${{ inputs.load && '1' || '' }}
        run: |
          if [ "${{ inputs.load }}" = "true" ]; then
            flutter test -j 6 test/icloud_reload_equivalence_test.dart test/notebook_test.dart test/reload_equivalence_test.dart --reporter expanded
          else
            flutter test test/icloud_reload_equivalence_test.dart --name "seed [0-9]+$" --reporter expanded
          fi

      - name: One seed, repeated
        if: ${{ !cancelled() && inputs.repeat_count != '0' }}
        shell: bash
        working-directory: app
        timeout-minutes: 75
        env:
          NOTED_RELOAD_REPEAT_SEED: ${{ inputs.repeat_seed }}
          NOTED_RELOAD_REPEAT_COUNT: ${{ inputs.repeat_count }}
          NOTED_RELOAD_ONLY_SEEDS: ${{ inputs.load && '1' || '' }}
        run: |
          if [ "${{ inputs.load }}" = "true" ]; then
            flutter test -j 6 test/icloud_reload_equivalence_test.dart test/notebook_test.dart test/reload_equivalence_test.dart --reporter expanded
          else
            flutter test test/icloud_reload_equivalence_test.dart --name "seed ${NOTED_RELOAD_REPEAT_SEED}, run [0-9]+ of" --reporter expanded
          fi
