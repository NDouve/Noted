name: noted_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/noted_core
  - packages/noted_canvas
  - packages/boxes/note
  - packages/boxes/ai
  - packages/boxes/drawing
  - packages/boxes/template
  - packages/boxes/attachments
  - packages/noted_mcp
  - packages/noted_auth
  - packages/noted_sync

dev_dependencies:
  flutter_lints: ^6.0.0

# flutter_secure_storage 11.0.0 wants flutter_secure_storage_windows ^4.2.2, which
# needs win32 ^6, but file_picker 10.3.10 (through appflowy_editor) needs win32
# ^5.9. Version 4.1.0 of the Windows part works with win32 5. Drop this when
# file_picker allows win32 6.
dependency_overrides:
  flutter_secure_storage_windows: 4.1.0
