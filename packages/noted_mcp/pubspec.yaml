name: noted_mcp
description: "Noted's read-only MCP server: a separate executable that reads saved page files only (invariant 4). Pure Dart, no Flutter."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  noted_mcp:

dependencies:
  # The Dart team's MCP implementation (BSD-3-Clause), approved by the
  # maintainer.
  dart_mcp: ^0.5.2
  noted_core:
    path: ../noted_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
