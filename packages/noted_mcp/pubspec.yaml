name: noted_mcp
description: "Noted's MCP server: a separate executable that reads saved page files, and writes only its own access log and, with Noted closed, an AI box that allows it (invariant 4). Pure Dart, no Flutter."
publish_to: none
version: 0.5.0
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  noted_mcp:

dependencies:
  # The Dart team's MCP implementation (BSD-3-Clause), approved by the
  # maintainer.
  dart_mcp: ^0.5.2
  noted_core:
    path: ../noted_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
