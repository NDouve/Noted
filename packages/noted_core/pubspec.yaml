name: noted_core
description: "Noted core: page model, page file format, page tree, storage and the data side of the Box API. Pure Dart, no Flutter."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

# Pure Dart only. lib/ must stay free of Flutter imports so a
# separate pure-Dart executable (the future MCP server) can depend on it.

dependencies:
  # SHA-256 content hashes of attachments (BSD-3-Clause, the Dart team).
  crypto: ^3.0.7
  # Markdown parsing for the note importer (BSD-3-Clause, the Dart team).
  markdown: 7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
