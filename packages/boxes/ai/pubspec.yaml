name: noted_box_ai
description: "The AI box module for Noted: a note-like box that an AI connection owns and writes to."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  noted_core:
    path: ../../noted_core
  noted_canvas:
    path: ../../noted_canvas
  noted_box_note:
    path: ../note

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The tests build an editor and press keys in it; same pinned ref as the
  # note box (an existing dependency).
  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: 01eccc6ee36bd07698bd80915289fe7070478cd2
