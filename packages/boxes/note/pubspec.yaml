name: noted_box_note
description: "The plain note box module for Noted, built on appflowy_editor."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Pinned to an upstream commit: the 6.2.0 release does not compile with
  # Flutter 3.47 (missing TextInputClient.onFocusReceived). Move back to a
  # pub.dev release once one includes the fix.
  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: 01eccc6ee36bd07698bd80915289fe7070478cd2
  noted_core:
    path: ../../noted_core
  noted_canvas:
    path: ../../noted_canvas
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
