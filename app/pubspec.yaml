name: noted
description: "Noted: an open-source, OneNote-style notebook with freeform canvas pages."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  noted_core:
    path: ../packages/noted_core
  noted_canvas:
    path: ../packages/noted_canvas
  noted_box_drawing:
    path: ../packages/boxes/drawing
  noted_box_note:
    path: ../packages/boxes/note
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Inter (SIL OFL 1.1, see assets/fonts/Inter/OFL.txt), shipped with its
  # licence. Static weights: regular, medium, semibold, bold.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/Inter/OFL.txt
