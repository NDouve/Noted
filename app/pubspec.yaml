name: noted
description: "Noted: an open-source, OneNote-style notebook with freeform canvas pages."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  noted_core:
    path: ../packages/noted_core
  noted_canvas:
    path: ../packages/noted_canvas
  noted_box_note:
    path: ../packages/boxes/note

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
