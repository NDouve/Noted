name: noted
description: "Noted: an open-source, OneNote-style notebook with freeform canvas pages."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  noted_core:
    path: ../packages/noted_core
  noted_canvas:
    path: ../packages/noted_canvas
  noted_box_drawing:
    path: ../packages/boxes/drawing
  noted_box_template:
    path: ../packages/boxes/template
  noted_box_note:
    path: ../packages/boxes/note
  noted_box_attachments:
    path: ../packages/boxes/attachments
  noted_box_ai:
    path: ../packages/boxes/ai
  file_selector: ^1.1.0
  # Files dropped onto the canvas (Apache-2.0). 0.9 needs cross_file 0.4,
  # which appflowy_editor (through file_picker) does not allow yet.
  desktop_drop: ^0.8.4
  # Images on the clipboard (Apache-2.0).
  pasteboard: ^0.6.0
  # Opens attachments and links with the default app (BSD-3-Clause).
  url_launcher: ^6.3.3
  path_provider: 2.1.5
  noted_auth:
    path: ../packages/noted_auth
  # Microsoft sign-in (OneDrive sync stage 2), both BSD-3-Clause, approved by
  # the maintainer and pinned; neither is from the Flutter team.
  # flutter_appauth opens the system browser sheet on iOS, Android and macOS;
  # flutter_secure_storage keeps the refresh token in the keychain or keystore.
  flutter_appauth: 13.0.0
  flutter_secure_storage: 11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Inter (SIL OFL 1.1, see assets/fonts/Inter/OFL.txt), shipped with its
  # licence. Static weights: regular, medium, semibold, bold.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/Inter/OFL.txt
