<!-- @dsCard group="Canvas" height=240 width=1040 subtitle="Plain, Dots, Graph, Ruled" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text);font-size:12px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
figure{margin:0;display:flex;flex-direction:column;gap:var(--space-2)}
.pg{height:160px;border:1px solid var(--border);border-radius:var(--radius-lg);background-color:var(--bg-canvas)}
.dots{background-image:radial-gradient(var(--paper-dot) 1.5px,transparent 1.6px);background-size:var(--paper-pitch) var(--paper-pitch)}
.graph{background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:var(--paper-pitch) var(--paper-pitch)}
.ruled{background-image:linear-gradient(90deg,transparent 63px,var(--paper-margin) 63px,var(--paper-margin) 64px,transparent 64px),linear-gradient(transparent calc(var(--paper-pitch) - 1px),var(--paper-line) calc(var(--paper-pitch) - 1px));background-size:100% 100%,100% var(--paper-pitch)}
figcaption{color:var(--text-muted);font-size:12px;line-height:16px}
</style>
</head>
<body>
<div class="row">
  <figure><div class="pg"></div><figcaption>Plain (default)</figcaption></figure>
  <figure><div class="pg dots"></div><figcaption>Dots</figcaption></figure>
  <figure><div class="pg graph"></div><figcaption>Graph</figcaption></figure>
  <figure><div class="pg ruled"></div><figcaption>Ruled</figcaption></figure>
</div>
</body>
</html>
